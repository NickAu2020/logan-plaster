<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stats</title></head><body style="font-family:sans-serif;padding:20px"><h2>Logan Plaster - site stats</h2><p>Visits: <b id="visits">...</b></p><p>Call clicks: <b id="call-clicks">...</b></p><p>Text-photos clicks: <b id="sms-clicks">...</b></p><p><small>Totals since 1 Nov 2026. Opening this page sets "don't count me" on this device. "None yet" means no clicks of that type have been recorded. "Error" means the counter could not be read.</small></p><script>localStorage.setItem("lp_notrack","1");["visits","call-clicks","sms-clicks"].forEach(function(k){fetch("https://abacus.jasoncameron.dev/info/logan-plaster-site/"+k).then(function(r){if(!r.ok)throw new Error("http");return r.json()}).then(function(d){var el=document.getElementById(k);if(!d||d.exists===false){el.textContent="none yet"}else if(d.value!=null&&d.value>=0){el.textContent=d.value}else{el.textContent="none yet"}}).catch(function(){document.getElementById(k).textContent="error"})});</script></body></html>
